[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aeon-matrix"
version = "0.1.0"
description = "AEON MATRIX Enterprise AI Platform"
requires-python = ">=3.10"

dependencies = [
    "gradio>=5.0.0",
    "fastapi>=0.116.0",
    "uvicorn>=0.35.0",
    "pydantic>=2.11.0",
    "pytest>=8.4.0",
    "pytest-cov>=6.2.0",
    "requests>=2.32.0",
    "httpx>=0.28.0",
    "numpy>=2.3.0",
    "pandas>=2.3.0",
    "python-dotenv>=1.1.0",
    "rich>=14.0.0",
    "typing_extensions>=4.14.0"
]
