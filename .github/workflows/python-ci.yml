name: Python CI

on:
  push:
    branches:
      - "**"
  workflow_dispatch:
  pull_request:
    branches:
      - "**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Python Path
        run: |
          echo "PYTHONPATH=$PWD:$PWD/src:$PWD/services:$PWD/services/guardian" >> $GITHUB_ENV

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install pytest pytest-cov

      - name: Compile check
        run: python -m compileall services

      - name: Run tests
        run: python -m pytest -v

      - name: Coverage
        run: python -m pytest --cov=services.guardian --cov-config=.coveragerc.guardian --cov-config=.coveragerc --cov-report=term-missing --cov-fail-under=0
